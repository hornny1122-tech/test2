<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR หมากับแมววิ่งไล่จับ</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    .info {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0,0,0,.65);
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      font-family: Arial, sans-serif;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="info">📷 ส่องกล้องไปที่ Hiro Marker<br>🐶 หมากับ 🐱 แมวจะวิ่งไล่จับกันเป็นวงกลม</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    device-orientation-permission-ui="enabled: false">

    <!-- Hiro Marker -->
    <a-marker preset="hiro" id="hiroMarker">

      <!-- พื้นวงกลม -->
      <a-cylinder
        position="0 0.01 0"
        radius="1.15"
        height="0.03"
        color="#7CFC00"
        opacity="0.18"
        transparent>
      </a-cylinder>

      <!-- หมา -->
      <a-entity id="dog"
        position="0 0.35 0"
        scale="0.45 0.45 0.45"
        dog-runner>
        <!-- ตัว -->
        <a-sphere position="0 0.15 0" radius="0.38" color="#C98A4B"></a-sphere>
        <!-- หัว -->
        <a-sphere position="0 0.62 -0.05" radius="0.30" color="#D69A5B"></a-sphere>
        <!-- หู -->
        <a-cone position="-0.22 0.82 0" radius-bottom="0.12" radius-top="0.02" height="0.28" color="#8B5A2B" rotation="0 0 -20"></a-cone>
        <a-cone position="0.22 0.82 0" radius-bottom="0.12" radius-top="0.02" height="0.28" color="#8B5A2B" rotation="0 0 20"></a-cone>
        <!-- ตา -->
        <a-sphere position="-0.11 0.68 -0.27" radius="0.045" color="#111"></a-sphere>
        <a-sphere position="0.11 0.68 -0.27" radius="0.045" color="#111"></a-sphere>
        <!-- จมูก -->
        <a-sphere position="0 0.58 -0.34" radius="0.06" color="#222"></a-sphere>
        <!-- หาง -->
        <a-cylinder position="0.34 0.38 0" radius="0.045" height="0.5" color="#A66A32" rotation="0 0 -45"></a-cylinder>
        <!-- ป้าย -->
        <a-text value="DOG" align="center" position="0 1.05 0" scale="0.7 0.7 0.7" color="#ffffff"></a-text>
      </a-entity>

      <!-- แมว -->
      <a-entity id="cat"
        position="0 0.35 0"
        scale="0.42 0.42 0.42"
        cat-runner>
        <!-- ตัว -->
        <a-sphere position="0 0.15 0" radius="0.36" color="#BDBDBD"></a-sphere>
        <!-- หัว -->
        <a-sphere position="0 0.62 -0.05" radius="0.30" color="#D0D0D0"></a-sphere>
        <!-- หูสามเหลี่ยม -->
        <a-cone position="-0.20 0.84 0" radius-bottom="0.13" radius-top="0" height="0.28" color="#AAAAAA"></a-cone>
        <a-cone position="0.20 0.84 0" radius-bottom="0.13" radius-top="0" height="0.28" color="#AAAAAA"></a-cone>
        <!-- ตา -->
        <a-sphere position="-0.11 0.68 -0.27" radius="0.045" color="#24A148"></a-sphere>
        <a-sphere position="0.11 0.68 -0.27" radius="0.045" color="#24A148"></a-sphere>
        <!-- จมูก -->
        <a-sphere position="0 0.58 -0.34" radius="0.045" color="#E88AAA"></a-sphere>
        <!-- หนวด -->
        <a-cylinder position="-0.16 0.57 -0.32" radius="0.008" height="0.32" color="#555" rotation="0 0 70"></a-cylinder>
        <a-cylinder position="0.16 0.57 -0.32" radius="0.008" height="0.32" color="#555" rotation="0 0 -70"></a-cylinder>
        <!-- หาง -->
        <a-torus position="0.34 0.40 0" radius="0.20" radius-tubular="0.035" color="#999" rotation="90 0 0"></a-torus>
        <!-- ป้าย -->
        <a-text value="CAT" align="center" position="0 1.05 0" scale="0.7 0.7 0.7" color="#ffffff"></a-text>
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

<script>
/*
  การเคลื่อนที่:
  - หมาและแมววิ่งเป็นวงกลมรอบ Hiro Marker
  - แมวอยู่ด้านหน้าเล็กน้อย ทำให้ดูเหมือนหมาวิ่งไล่แมว
  - หมุนตัวตามทิศทางการวิ่ง
*/
AFRAME.registerComponent('dog-runner', {
  init: function () {
    this.angle = 0;
    this.radius = 0.72;
    this.speed = 1.65;
  },
  tick: function (time, delta) {
    if (!delta) return;
    this.angle += this.speed * delta / 1000;

    const x = Math.cos(this.angle) * this.radius;
    const z = Math.sin(this.angle) * this.radius;

    this.el.object3D.position.set(x, 0.35, z);

    // หันหน้าไปตามทิศทางการวิ่ง
    this.el.object3D.rotation.y = -this.angle + Math.PI / 2;

    // เด้งขึ้นลงเล็กน้อยให้ดูเหมือนวิ่ง
    this.el.object3D.position.y =
      0.35 + Math.abs(Math.sin(this.angle * 8)) * 0.045;
  }
});

AFRAME.registerComponent('cat-runner', {
  init: function () {
    this.angle = Math.PI / 2;
    this.radius = 0.72;
    this.speed = 1.65;
  },
  tick: function (time, delta) {
    if (!delta) return;
    this.angle += this.speed * delta / 1000;

    const x = Math.cos(this.angle) * this.radius;
    const z = Math.sin(this.angle) * this.radius;

    this.el.object3D.position.set(x, 0.35, z);
    this.el.object3D.rotation.y = -this.angle + Math.PI / 2;

    this.el.object3D.position.y =
      0.35 + Math.abs(Math.sin(this.angle * 8 + 1)) * 0.045;
  }
});

// ปรับขนาด/การแสดงผลเมื่อพบ Marker
const marker = document.querySelector('#hiroMarker');
marker.addEventListener('markerFound', () => {
  console.log('Hiro Marker Found!');
});

marker.addEventListener('markerLost', () => {
  console.log('Hiro Marker Lost!');
});
</script>

</body>
</html>
